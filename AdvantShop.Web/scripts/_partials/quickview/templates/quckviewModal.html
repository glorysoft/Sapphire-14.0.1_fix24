<div
    class="quickview-loading-text icon-spinner-before icon-animate-spin-before"
    data-ng-if="!quickview.contentLoaded"
    data-ng-bind="::'Js.Quickview.Loading' | translate"></div>
<div data-is-mobile data-oc-lazy-load="[{files:['productQuickview']}]">
    <div data-onload="quickview.contentLoaded = true;" data-ng-include="quickview.url" data-ng-if="modal.isOpen"></div>
    <a
        href="javascript:void(0)"
        class="icon-left-open-before quickview-arrows-prev cs-l-4 link-text-decoration-none"
        data-ng-show="quickview.itemData.siblings != null && quickview.itemData.siblings[0] != quickview.productId"
        data-ng-click="quickview.prev(quickview)"></a>
    <a
        href="javascript:void(0)"
        class="icon-right-open-before quickview-arrows-next cs-l-4 link-text-decoration-none"
        data-ng-show="quickview.itemData.siblings !=null && quickview.itemData.siblings[quickview.itemData.siblings.length-1] != quickview.productId"
        data-ng-click="quickview.next(quickview)"></a>
</div>
