<div data-ng-switch="cartFullItems.cartData.CartProducts.length > 0">
    <div data-ng-switch-when="true" class="cart-full-items-wrap">
        <div class="cart-full-items">
            <div
                class="cart-full-items__product cart-full-product cs-bg-7"
                data-ng-repeat="item in cartFullItems.cartData.CartProducts track by $index">
                <div class="cart-full-product__info" data-ng-class="{'cart-full-product__info--two-cols': cartFullItems.showPhoto !== false}">
                    <figure
                        data-ng-if="cartFullItems.showPhoto !== false"
                        class="cart-full-product__photo"
                        data-ng-style="{'width': 70 + 'px'}"
                        data-ng-switch="cartFullItems.linkAsQuickview">
                        <a data-ng-switch-default class="cart-full-product__photo-link" href="{{item.Link}}">
                            <img data-ng-src="{{item.PhotoSmallPath}}" loading="lazy" alt="{{item.PhotoAlt}}" />
                        </a>
                        <a
                            data-ng-switch-when="true"
                            class="cart-full-product__photo-link"
                            data-quickview-trigger
                            data-alone="true"
                            data-product-id="item.ProductId"
                            data-offer-id="item.OfferId">
                            <img data-ng-src="{{item.PhotoSmallPath}}" loading="lazy" alt="{{item.PhotoAlt}}" />
                        </a>
                    </figure>

                    <div class="cart-full-product__attributes" data-ng-switch="cartFullItems.linkAsQuickview">
                        <a data-ng-switch-default href="{{item.Link}}" class="cart-full-product__name" data-ng-bind="item.Name"></a>
                        <a
                            data-ng-switch-when="true"
                            class="cart-full-product__name"
                            data-quickview-trigger
                            data-alone="true"
                            data-product-id="item.ProductId"
                            data-offer-id="item.OfferId"
                            data-ng-bind="item.Name">
                        </a>
                        <div class="cart-full-product__sku">
                            <span class="cart-full-product__sku-name" data-ng-bind="('Js.Cart.Sku' | translate) + ': '"></span>
                            <span class="cart-full-product__sku-value" data-ng-bind="item.Sku"></span>
                        </div>
                        <ul class="cart-full-product__properties" data-ng-if="item.ColorName || item.SizeName || item.SelectedOptions.length > 0">
                            <li class="cart-full-product__properties-item" data-ng-if="item.ColorName">
                                <div class="cart-full-product__properties-name" data-ng-bind="(cartFullItems.cartData.ColorHeader + ':')"></div>
                                <div class="cart-full-product__properties-value" data-ng-bind="item.ColorName"></div>
                            </li>
                            <li class="cart-full-product__properties-item" data-ng-if="item.SizeName">
                                <div class="cart-full-product__properties-name" data-ng-bind="(cartFullItems.cartData.SizeHeader + ':')"></div>
                                <div class="cart-full-product__properties-value" data-ng-bind="item.SizeName"></div>
                            </li>
                            <li
                                class="cart-full-product__properties-item"
                                data-ng-if="item.SelectedOptions.length > 0"
                                data-ng-repeat="option in item.SelectedOptions track by $index">
                                <div
                                    data-ng-if="option.OptionTitle || option.OptionText || option.FormatPrice || option.OptionAmount > 1"
                                    class="cart-full-product__properties-name"
                                    data-ng-bind="(option.CustomOptionTitle + (option.OptionTitle ? ':':''))"></div>
                                <div class="cart-full-product__properties-value">
                                    <span data-ng-if="!option.OptionTitle && !option.OptionText && !option.FormatPrice && !(option.OptionAmount > 1)">
                                        {{option.CustomOptionTitle + option.OptionTitle}}
                                    </span>
                                    <span data-ng-bind="option.OptionTitle"></span>
                                    <span data-ng-bind="option.OptionText"></span>
                                    <span data-ng-bind="option.FormatPrice"></span>
                                    <span
                                        data-ng-if="option.OptionAmount != null && option.OptionAmount > 1"
                                        data-ng-bind="'x ' + option.OptionAmount"></span>
                                </div>
                            </li>
                        </ul>
                        <div data-ng-if="item.BriefDescription.length && cartFullItems.isCheckout && cartFullItems.showBriefDescription">
                            <readmore data-line-clamp="4">
                                <div data-ng-bind-html="item.BriefDescription" class="checkout-cart-item-brief-description"></div>
                            </readmore>
                        </div>
                        <div class="cart-full-product__btns">
                            <a
                                href="javascript:void(0)"
                                role="link"
                                data-ng-if="!item.IsGift"
                                data-ng-click="cartFullItems.remove($event, item.ShoppingCartItemId)"
                                class="cart-full-product__remove-btn btn cart-full-remove-item-btn icon-cancel-circled-before link-text-decoration-none cs-l-3"
                                title="{{ ::'Js.Cart.Delete' | translate }}"></a>
                            <label
                                data-ng-if="cartFullItems.cartData.IsWishListVisibility"
                                class="cart-full-product__wishlist-control wishlist-control btn ng-cloak cart-full-wishlist"
                                data-wishlist-control="item.OfferId"
                                data-ng-init="wishlistControl.isAdded = item.InWishlist"
                                data-ng-class="{'wishlist-state-add ': wishlistControl.isAdded, 'wishlist-state-not-add': !wishlistControl.isAdded}">
                                <input
                                    type="checkbox"
                                    class="custom-input-native wishlist-checkbox"
                                    data-ng-model="wishlistControl.isAdded"
                                    data-ng-change="wishlistControl.change(item.OfferId, wishlistControl.isAdded)" />
                                <span
                                    class="icon-heart-after wishlist-control__icon"
                                    data-ng-class="{'cs-t-6': wishlistControl.isAdded, 'cs-l-3': !wishlistControl.isAdded}"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="cart-full-product__cost" data-ng-bind="item.Cost"></div>
                    <div class="cart-full-product__price">
                        <div>
                            <div data-ng-if="item.Discount.HasValue && !item.IsGift" class="inline price-old cs-t-3">
                                <span class="price-number" data-ng-bind="item.CostWithoutDiscount"></span>
                            </div>
                            <span data-ng-if="cartFullItems.cartData.IsShowUnits && item.Unit" data-ng-bind="'/' + item.Unit"></span>
                        </div>
                        <div class="cart-full-product__price-rule cs-t-3" data-ng-if="item.PriceRuleName" data-ng-bind="item.PriceRuleName"></div>
                    </div>
                </div>
                <div class="cart-full-product__amount">
                    <div
                        class="cart-full-product__amount-control cart-full-amount-control"
                        data-ng-class="{'cart-full-amount-control--with-unit cart-full-product__amount-control--with-unit' : item.Unit != null}"
                        data-ng-if="!item.FrozenAmount"
                        data-spinbox
                        data-only-validation="cartFullItems.isCheckout"
                        data-value="item.Amount"
                        data-proxy="item.ShoppingCartItemId"
                        data-update-fn="cartFullItems.updateAmount(value, proxy)"
                        data-step="item.Multiplicity"
                        data-max="item.MaxAmount"
                        data-min="item.MinAmount"></div>
                    <span data-ng-if="item.FrozenAmount" data-ng-bind="item.Amount"></span>
                    <div class="cart-full-product__price-with-discount">
                        <div class="inline" data-ng-bind="item.PriceWithDiscount"></div>
                        <span data-ng-bind="'/' + (item.Unit || ('Js.Cart.UnitDefault' | translate))"></span>
                    </div>
                    <div class="cart-full-product__amount-error-wrap">
                        <div class="cart-full-product__amount-error" data-ng-bind="item.Avalible"></div>
                        <div class="cart-full-product__amount-error" data-ng-if="item.Avalible == '' && item.AvailableAmount == 0">
                            {{ ::'Js.Cart.PreOrder' | translate }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="cart-full-error" data-ng-if="cartFullItems.cartData.Valid != ''" data-ng-bind="cartFullItems.cartData.Valid"></div>
    </div>
    <div data-ng-switch-when="false">
        <div class="cart-full-empty">{{ ::'Js.Cart.EmptyCart' | translate }}</div>
    </div>
</div>
