<div class="warehouses-map" data-ng-if="$ctrl.points.length">
    <points-list-map
        data-points="$ctrl.points"
        data-show-all="true"
        data-show-only-points-list-by-bounds="false"
        data-filters="$ctrl.filters"
        data-show-details-point="$ctrl.showDetailsPoint"></points-list-map>
</div>
