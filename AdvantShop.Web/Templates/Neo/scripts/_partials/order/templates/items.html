<div>
    <div
        class="h2 myaccount-subtitle"
        data-ng-bind-html="parentScope.titleText != null && parentScope.titleText.length > 0 ? parentScope.titleText: 'Заказы <span class=\'order-history-count\'>' + parentScope.items.Orders.length + '</span>' "></div>

    <ul class="order-history-list">
        <li class="order-history-list__item" data-ng-repeat="item in parentScope.items.Orders track by $index"
            data-ng-click="parentScope.view(item.OrderNumber)">
            <div class="order-history-list__item-header">
                <h6 class="order-history-list__item-date">
                    <span data-ng-bind="'Js.Order.Order' | translate"></span>
                    <span data-ng-bind="'№' + item.OrderNumber"></span>
                    <span data-ng-bind="'Js.Order.OrderFrom' | translate"></span>
                    <span data-ng-bind="item.OrderDate"></span>
                </h6>
                <div class="order-history-list__item-cost">
                    <span class="order-history-list__item-cost-payed"
                          data-ng-bind="item.Payed ? 'Js.Order.IsPaied' : 'Js.Order.IsNotPaid' | translate"></span>
                    <span class="order-history-list__item-cost-value" data-ng-bind="item.Sum"></span>
                </div>
            </div>
            <div class="order-history-list__item-data cs-bg-7">
                <div class="order-history-list__item-shipping">
                    <div class="order-history-list__item-shipping-name" data-ng-bind="item.ShippingMethodName"></div>
                    <div class="order-history-list__item-shipping-data cs-t-3">
                        <span data-ng-if="item.DeliveryDate">
                            <span data-ng-bind="'Js.Order.DeliveryDate'|translate"></span> :
                            <span data-ng-bind="item.DeliveryDate"></span>
                        </span>
                        <span data-ng-if="item.DeliveryAddress">
                            <span data-ng-bind="'Js.Order.DeliveryAddress'|translate"></span> :
                            <span data-ng-bind="item.DeliveryAddress"></span>
                        </span>
                    </div>

                </div>
                <div class="order-history-list__item-photo-list">
                    <img class="order-history-list__item-photo-item" data-ng-src="{{orderItem.Photo.ProductImageSrcBig}}"
                         data-ng-repeat="orderItem in item.OrderItems track by $index" alt="{{orderItem.Alt || orderItem.Title}}">
                </div>
            </div>
        </li>
    </ul>


    <div data-ng-if="parentScope.items.Orders.length == 0">
        <div class="order-history-empty-text">{{ ::'Js.Order.EmptyOrderListMsg' | translate }}</div>
        <div ng-if="!parentScope.isLp && !parentScope.linkAsQuickView" class="text-align-center">
            <a href="catalog" class="btn btn-middle btn-confirm">{{ ::'Js.Order.GoToCatalog' | translate }}</a>
        </div>
    </div>

</div>
