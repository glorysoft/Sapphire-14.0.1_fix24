<ui-ace-textarea ui-ace-options="{mode: 'html'}" ng-model="$ctrl.modalData.settings.html">
    <textarea id="value" name="value" ng-model="$ctrl.modalData.settings.html" cols="20" rows="2"></textarea>
</ui-ace-textarea>
<div class="blocks-constructor-settings-col--alt">
    <div>
        <label class="blocks-constructor-label" data-e2e="ShowOnAllPage">
            <input class="blocks-constructor-checkbox-native" type="checkbox" ng-model="$ctrl.modalData.settings.show_on_all_landing_pages_top" />
            <span class="blocks-constructor-checkbox"></span>
            <span class="blocks-constructor-label-text"> {{'Admin.Js.Landings.BlocksConstructor.Controllers.Html.ShowAllPagesTop'|translate}}</span>
        </label>
    </div>
</div>
<div class="blocks-constructor-settings-col--alt">
    <div>
        <label class="blocks-constructor-label" data-e2e="ShowOnAllPageBottom">
            <input class="blocks-constructor-checkbox-native" type="checkbox" ng-model="$ctrl.modalData.settings.show_on_all_landing_pages_bottom" />
            <span class="blocks-constructor-checkbox"></span>
            <span class="blocks-constructor-label-text"> {{'Admin.Js.Landings.BlocksConstructor.Controllers.Html.ShowAllPagesBelow'|translate}} </span>
        </label>
    </div>
</div>
