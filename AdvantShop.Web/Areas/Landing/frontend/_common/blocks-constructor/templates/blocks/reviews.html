<div>
    <div data-tabs class="tabs tabs-horizontal tabs-lp--minimalistic">
        <ul class="tabs-headers row center-xs start-sm">
            <li
                id="tabCoverFront"
                class="tabs-header-item tabs-lp__header-item--minimalistic-slim col-xs-12 col-sm-slim"
                data-tab-header=""
                data-ng-class="{'tabs-header-active block-constructor-settings-link' : tabHeader.selected}">
                <span
                    class="tabs-header-item-link"
                    data-ng-click="tabs.change(tabHeader)"
                    data-ng-class="{'link-dotted-invert' : !tabHeader.selected, 'cs-l-2 link-dotted-invert link-dotted-none' : tabHeader.selected}">
                    {{'Admin.Js.Landings.BlocksConstructor.Reviews.AppearanceTab'|translate}}
                </span>
            </li>

            <li
                id="reviews"
                class="tabs-header-item tabs-lp__header-item--minimalistic-slim col-xs-12 col-sm-slim"
                data-tab-header=""
                data-ng-class="{'tabs-header-active block-constructor-settings-link' : tabHeader.selected}">
                <span
                    class="tabs-header-item-link"
                    data-ng-click="tabs.change(tabHeader)"
                    data-ng-class="{'link-dotted-invert' : !tabHeader.selected, 'cs-l-2 link-dotted-invert link-dotted-none' : tabHeader.selected}">
                    {{'Admin.Js.Landings.BlocksConstructor.Reviews.ReviewsTab'|translate}}
                </span>
            </li>
        </ul>
        <div class="tabs-content">
            <div class="tab-content" data-tab-content="tabCoverFront" data-ng-class="{'tab-content-active': tabContent.header.selected}">
                <div>
                    <div class="row">
                        <div class="col-xs-12 col-sm-6">
                            <div class="blocks-constructor-settings-col">
                                <div ng-include="$ctrl.modalData.generalOptionsTemplateUrl"></div>
                                <div ng-include="$ctrl.modalData.buttonOptionsTemplateUrl"></div>
                            </div>
                        </div>
                        <div class="col-xs-12 col-sm-6">
                            <div class="blocks-constructor-settings-col--alt">
                                <div ng-include="$ctrl.modalData.generalRightOptionsTemplateUrl"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-content" data-tab-content="reviews" data-ng-class="{'tab-content-active': tabContent.header.selected}">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="blocks-constructor-settings-col--alt">
                            <lp-grid
                                lp-id="$ctrl.modalData.landingpageId"
                                block-id="$ctrl.modalData.blockId"
                                source="$ctrl.modalData.settings.items"
                                data-e2e="RewiewsGrid">
                                <lp-grid-column
                                    type="picture"
                                    field="picture"
                                    settings-picture="$ctrl.modalData.settings.settings_picture"
                                    classes="'col-xs'"
                                    title="{{'Admin.Js.Landings.BlocksConstructor.Reviews.PhotoColumn'|translate}}"></lp-grid-column>
                                <lp-grid-column
                                    main="{{'Admin.Js.Landings.BlocksConstructor.Reviews.AuthorColumn'|translate}}"
                                    type="text"
                                    field="author"
                                    placeholder="'Admin.Js.Landings.BlocksConstructor.Reviews.AuthorPlaceholder'|translate"
                                    classes="'col-xs'"
                                    title="{{'Admin.Js.Landings.BlocksConstructor.Reviews.AuthorColumn'|translate}}"></lp-grid-column>
                                <lp-grid-column
                                    type="text"
                                    field="caption"
                                    placeholder="'Admin.Js.Landings.BlocksConstructor.Reviews.CaptionColumn'|translate"
                                    classes="'col-xs'"
                                    title="{{'Admin.Js.Landings.BlocksConstructor.Reviews.CaptionColumn'|translate}}"></lp-grid-column>
                                <lp-grid-column
                                    type="textarea"
                                    field="text"
                                    placeholder="'Admin.Js.Landings.BlocksConstructor.Reviews.TextPlaceholder'|translate"
                                    classes="'col-xs-5'"
                                    title="{{'Admin.Js.Landings.BlocksConstructor.Reviews.TextColumn'|translate}}"></lp-grid-column>
                            </lp-grid>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
