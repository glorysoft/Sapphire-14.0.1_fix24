<div is-mobile>

    <div class="m-b-md">
        <div class="row m-b-xs">
            <div class="col-xs-12" data-ng-class="{'setting__label m-b-xs': isMobile.value}">
                Временной интервал:
            </div>
        </div>
        <div class="row">
            <div class="col-xs-12 flex middle-xs" data-ng-class="{'flex-wrap': isMobile.value}">
                <div class="input-group"
                     data-ng-class="{'flex flex-nowrap': isMobile.value}"
                     ng-flatpickr
                     fp-opts="{dateFormat: 'd.m.Y', startDateFormat: 'Y-m-d', wrap: true}"
                     fp-on-change="ctrl.onChangeTime()">
                    <span class="flatpickr-custom-wrap" data-ng-class="{'flex-grow': isMobile.value}">
                        <input type="text"
                               class="form-control input-alt"
                               ng-flatpickr-input
                               ng-model="ctrl.dateFrom">
                    </span>
                    <span class="input-group-addon" data-toggle><i class="fas fa-calendar-alt"></i></span>
                </div>
                <div class="inline m-l-sm m-r-sm" style="">-</div>
                <div class="input-group"
                     data-ng-class="{'flex flex-nowrap': isMobile.value}"
                     ng-flatpickr
                     fp-opts="{dateFormat: 'd.m.Y', startDateFormat: 'Y-m-d', wrap: true}"
                     fp-on-change="ctrl.onChangeTime()">
                    <span class="flatpickr-custom-wrap" data-ng-class="{'flex-grow': isMobile.value}">
                        <input type="text" class="form-control input-alt"
                           ng-flatpickr-input
                           ng-model="ctrl.dateTo">
                    </span>
                    <span class="input-group-addon" data-toggle><i class="fas fa-calendar-alt"></i></span>
                </div>
            </div>
        </div>
    </div>

    <div>

        <div data-ng-repeat="actionStatisticsItem in ctrl.actionStatistics"
            class="m-b-lg">
            <h3 data-ng-bind="actionStatisticsItem.ActionName" class="m-b"></h3>

            <div style="height: 300px" data-ng-style="{'width': (!isMobile.value ? '650px' : 'auto')}">
                <canvas
                    class="chart chart-line"
                    chart-data="actionStatisticsItem.Chart.Data"
                    chart-labels="actionStatisticsItem.Chart.Labels"
                    chart-series="actionStatisticsItem.Chart.Series"
                    chart-colors="actionStatisticsItem.Chart.Colors"
                    chart-options="{maintainAspectRatio:false}"></canvas>
            </div>
            <div class="m-t emailing-stats-inner">
                <div data-ng-repeat="item in actionStatisticsItem.Statistics"
                     class="m-b-xs emailing-stats-content"
                     data-ng-class="{'flex flex-row-reverse m-l-sm m-r-sm': isMobile.value}">
                    <div class="emailing-stats-content-header">
                        {{item.Sum}}
                    </div>
                    <div data-ng-class="{'flex-grow': isMobile.value}">
                        {{item.Status}}
                    </div>
                </div>
            </div>
        </div>


        <div class="m-b-lg" data-ng-if="ctrl.pushStatistics != null">
            <h3 class="m-b">Push-уведомления</h3>

            <div style="height: 300px" data-ng-style="{'width': (!isMobile.value ? '650px' : 'auto')}">
                <canvas
                    class="chart chart-line"
                    chart-data="ctrl.pushStatistics.Chart.Data"
                    chart-labels="ctrl.pushStatistics.Chart.Labels"
                    chart-series="ctrl.pushStatistics.Chart.Series"
                    chart-colors="ctrl.pushStatistics.Chart.Colors"
                    chart-options="{maintainAspectRatio:false}"></canvas>
            </div>
            <div class="m-t emailing-stats-inner">
                <div data-ng-repeat="item in ctrl.pushStatistics.Statistics"
                     class="m-b-xs emailing-stats-content"
                     data-ng-class="{'flex flex-row-reverse m-l-sm m-r-sm': isMobile.value}">
                    <div class="emailing-stats-content-header">
                        {{item.Sum}}
                    </div>
                    <div data-ng-class="{'flex-grow': isMobile.value}">
                        {{item.Status}}
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>
