<form is-mobile>
    <div class="modal-header">
        <ui-modal-cross ng-if="!isMobile.value"></ui-modal-cross>
        <h2 class="modal-header-title">Точка доставки</h2>
    </div>
    <div class="modal-body">
        <div class="form-group row">
            <label class="col-xs-12 col-md-3 control-label">
                <span ng-class="{'text-required':ctrl.point.WarehouseId == null}">{{ ctrl.point.WarehouseId == null ? ('Admin.Js.ShippingMethods.Adress'|translate) : ('Admin.Js.ShippingMethods.Warehouse'|translate)}}</span>
            </label>
            <div class="col-xs-12 col-md-9">
                <input type="text"
                       class="form-control input-alt"
                       ng-model="ctrl.point.Address"
                       readonly
                       ng-readonly="ctrl.point.WarehouseId != null"
                       required
                       validation-input-text="{{'Admin.Js.ShippingMethods.Adress'|translate}}"
                       data-autofocus="ctrl.point.WarehouseId == null && !isMobile.value" />
            </div>
        </div>
        <div class="form-group row" ng-if="ctrl.point.WarehouseId == null">
            <label class="col-xs-12 col-md-3 control-label"> Описание </label>
            <div class="col-xs-12 col-md-9">
                <textarea class="form-control input-alt" ng-model="ctrl.point.Description" rows="2" cols="20" style="height: 100px"></textarea>
            </div>
        </div>
        <div class="form-group row">
            <label class="col-xs-12 col-md-3 control-label">
                {{'Admin.Js.PointDelivery.AvailablePaymentMethods'|translate}}
            </label>
            <div class="col-xs-12 col-md-9 relative" is-mobile>
                <div ng-class="{'m-b-sm p-b-xs' : isMobile.value && $index != ctrl.payments.length - 1,'m-b-sm' : !isMobile.value && $index != ctrl.payments.length - 1}" ng-repeat="item in ctrl.payments track by $index">
                    <label class="adv-checkbox-label form-label-block setting--m-t-sm" ng-class="{'method-notactive' : !item.Enabled}">
                        <input type="checkbox" checklist-model="ctrl.selectedPaymentMethods" checklist-value="item.PaymentMethodId" class="adv-checkbox-input" />
                        <span class="adv-checkbox-emul"></span>
                        <span class="">{{item.Name}}</span>
                    </label>
                </div>
            </div>
        </div>
        <div class="form-group row" ng-if="ctrl.point.WarehouseId == null">
            <label class="col-xs-12 col-md-3 control-label">
                <a href="https://yandex.ru/map-constructor/location-tool/" target="_blank"> Координаты </a>
            </label>
            <div class="col-xs-12 col-md-9">
                <input type="text"
                       class="form-control input-alt"
                       ng-model="ctrl.point.position"
                       ng-pattern="/^(\[)?(\d+(\.\d+)?,[ ]?\d+(\.\d+)?)(\])?$/i" />
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button
            data-e2e="ShippingAdd"
            class="btn btn-save btn-primary"
            type="button"
            data-button-validation-success="ctrl.save()"
            data-button-validation>
            {{ctrl.mode === 'add' ? ('Admin.Js.AddEdit.Add'|translate) : ('Admin.Js.AddEdit.Save'|translate)}}
        </button>
        <button data-e2e="ShippingCancel" class="btn btn-default btn-cancel" type="button" ng-click="ctrl.close()">
            {{'Admin.Js.ShippingMethods.Cancel'|translate}}
        </button>
    </div>
</form>
