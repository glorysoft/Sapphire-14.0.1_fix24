<form novalidate name="clearDataForm" data-is-mobile>
    <div class="modal-header">
        <ui-modal-cross data-ng-if="!isMobile.value"></ui-modal-cross>
        <h2 class="modal-header-title">{{'Admin.Js.ClearData.Title'|translate}}</h2>
    </div>
    <div class="modal-body" data-ng-init="ctrl.clearDataForm = clearDataForm">
        <div data-ng-class="{'form-group' : !isMobile.value}">
            <div class="row">
                <div class="col-xs-12 col-md-4" data-ng-class="{'control-label' : isMobile.value}">
                    <span class="text-required"> {{'Admin.Js.ClearData.Select'|translate}} </span>
                </div>
                <div class="col-xs-12 col-md-8">
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteCategories" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Categories'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteProducts" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Products'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteProperty" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Property'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteBrands" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Brands'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteOrder" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Orders'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteCustomers" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Customers'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteMenu" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Menu'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deletePage" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Pages'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteNews" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.News'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteCarousel" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Carousel'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteShippings" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Delivery'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deletePayments" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.Payment'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteTasks" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.TasksProjects'|translate}}</span>
                        </label>
                    </div>
                    <div class="form-group label-wrap">
                        <label class="adv-checkbox-label">
                            <input type="checkbox" data-ng-model="ctrl.deleteCrm" class="adv-checkbox-input" />
                            <span class="adv-checkbox-emul"></span>
                            <span class="adv-checkbox-text">{{'Admin.Js.ClearData.CRM'|translate}}</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-group">
            <div class="row">
                <div class="col-xs-9">
                    <label class="adv-checkbox-label">
                        <input
                            type="checkbox"
                            data-ng-model="ctrl.confirm"
                            class="adv-checkbox-input"
                            required
                            data-validation-input-text="{{'Admin.Js.ClearData.Confirm'|translate}}" />
                        <span class="adv-checkbox-emul"></span>
                        <span class="adv-checkbox-text">{{'Admin.Js.ClearData.ReallyWant'|translate}}</span>
                    </label>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button
            class="btn btn-save btn-primary"
            type="button"
            data-button-validation-success="ctrl.delete()"
            data-button-validation
            data-ladda="ctrl.btnSleep">
            {{'Admin.Js.ClearData.Delete'|translate}}
        </button>
        <button class="btn btn-default btn-cancel" type="button" data-ng-click="ctrl.close()">{{'Admin.Js.AddEdit.Cancel'|translate}}</button>
    </div>
</form>
